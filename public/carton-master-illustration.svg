<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Cartón master box on left -->
  <g id="carton-left">
    <!-- Main box body -->
    <path d="M50 180 L200 180 L220 160 L70 160 Z" fill="#D4A574" stroke="#8B6F47" stroke-width="2"/>
    <path d="M50 180 L50 320 L200 320 L200 180 Z" fill="#C9935D" stroke="#8B6F47" stroke-width="2"/>
    <path d="M200 180 L220 160 L220 300 L200 320 Z" fill="#B8813F" stroke="#8B6F47" stroke-width="2"/>

    <!-- Label -->
    <rect x="80" y="240" width="120" height="50" fill="#8B6F47" rx="3"/>
    <text x="140" y="260" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">CARTÓN</text>
    <text x="140" y="282" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">MASTER</text>
  </g>

  <!-- Arrow -->
  <path d="M240 220 L340 220" stroke="#6FA2DF" stroke-width="8" fill="none" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#6FA2DF"/>
    </marker>
  </defs>

